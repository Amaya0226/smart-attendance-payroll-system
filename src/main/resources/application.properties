
# ==========================================
# SMART ATTENDANCE & PAYROLL SYSTEM
# ==========================================

spring.application.name=smart-attendance-payroll-system

# ==========================================
# DATABASE CONFIGURATION - MariaDB
# ==========================================

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/smart_attendance_payroll?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# GMAIL SMTP CONFIGURATION
# ==========================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=smartattendancesystemproject@gmail.com

# Replace with your actual Gmail App Password
spring.mail.password=${GMAIL_APP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
